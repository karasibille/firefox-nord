name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check the tag against manifest.json
        run: |
          version=$(node -p 'require("./manifest.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME but manifest.json has version $version"
            exit 1
          fi

      - name: Lint
        run: npx --yes web-ext@10.7.0 lint --warnings-as-errors

      - name: Build
        run: npx --yes web-ext@10.7.0 build --overwrite-dest

      # AMO reviews the version; --approval-timeout 0 does not wait for it
      - name: Submit to addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::error::AMO_JWT_ISSUER and AMO_JWT_SECRET secrets are not set"
            exit 1
          fi
          npx --yes web-ext@10.7.0 sign --channel listed --approval-timeout 0

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp web-ext-artifacts/*.zip "nord-${GITHUB_REF_NAME#v}.xpi"
          gh release create "$GITHUB_REF_NAME" "nord-${GITHUB_REF_NAME#v}.xpi" --generate-notes
